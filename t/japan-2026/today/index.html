<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Japan 2026 行程</title>

<style>
/* Layout: Travel OS 的单列手机版式：顶栏 → 内容卡片 → 底部四键导航。颜色和字体沿用 personal-travel-os 的 BaseLayout。 */
:root{
  --ink:#17211b; --muted:#647069; --paper:#f5f2ea; --paper-2:#e9efe8;
  --card:#ffffffc2; --card-solid:#fdfcf8; --line:#17211b24;
  --green:#215c45; --green-deep:#185a46; --green-soft:#dbe8df; --green-wash:#eef4ef;
  --amber:#a6631d; --amber-soft:#f6e8d6; --red:#a13c31; --red-soft:#f6dedb; --blue:#315d7d;
  --shadow:0 18px 48px #272f2814;
  --serif:Georgia,"Times New Roman","Songti SC",serif;
  --sans:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ink:#e6ece7; --muted:#9aa79f; --paper:#121815; --paper-2:#17211c;
  --card:#1b2420e6; --card-solid:#1b2420; --line:#e6ece724;
  --green:#7fbf9f; --green-deep:#8fd0ae; --green-soft:#24392f; --green-wash:#1a2a22;
  --amber:#e0a464; --amber-soft:#3a2b1a; --red:#e88a7f; --red-soft:#3d2220; --blue:#8db4d3;
  --shadow:0 18px 48px #0006; color-scheme:dark}}
:root[data-theme="dark"]{
  --ink:#e6ece7; --muted:#9aa79f; --paper:#121815; --paper-2:#17211c;
  --card:#1b2420e6; --card-solid:#1b2420; --line:#e6ece724;
  --green:#7fbf9f; --green-deep:#8fd0ae; --green-soft:#24392f; --green-wash:#1a2a22;
  --amber:#e0a464; --amber-soft:#3a2b1a; --red:#e88a7f; --red-soft:#3d2220; --blue:#8db4d3;
  --shadow:0 18px 48px #0006; color-scheme:dark}

*{box-sizing:border-box}
body{background:linear-gradient(180deg,var(--paper-2),var(--paper) 420px) var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper-2)}
a{color:inherit}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}
.site-header{display:flex;align-items:center;gap:12px;padding-block:12px 14px;border-bottom:1px solid var(--line);margin-bottom:28px}
.brand-mark{width:42px;height:42px;border-radius:12px;background:var(--green-deep);color:#f5f2ea;display:grid;place-items:center;font-family:var(--serif);font-size:17px;letter-spacing:.04em}
.brand-name{font-weight:650;font-size:17px}
.brand-sub{margin-left:auto;font-size:12px;color:var(--muted)}
h1,h2,h3{text-wrap:balance;margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.muted{color:var(--muted)}
.amber{color:var(--amber)}
.red{color:var(--red)}
.tnum{font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:16px}

/* Today */
.hero{padding:20px 22px}
.hero .city{font-family:var(--serif);font-size:32px;line-height:1.2}
.hero .date{color:var(--muted);margin-top:4px}
.hero .clock{font-family:var(--serif);font-size:28px;margin-top:6px}
.hero .clock small{font-family:var(--sans);font-size:13px;color:var(--muted);margin-left:6px}
.next{padding:18px 20px;border:1.5px solid var(--green)}
.next h2{font-size:18px}
.next .hint{font-size:13px;color:var(--muted);margin:6px 0 10px}
.next ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.next li{display:grid;grid-template-columns:78px 1fr;gap:10px}
.next li .t{font-weight:650;color:var(--green)}
.next li .s{font-size:13px;color:var(--muted)}
.link-arrow{display:inline-block;font-weight:650;text-decoration:underline;text-underline-offset:4px;margin-top:4px}
.countdown{font-family:var(--serif);font-size:56px;line-height:1;color:var(--green-deep)}
.preview{padding:14px 16px;font-size:13px}
.preview select{font:inherit;padding:6px 8px;border-radius:10px;border:1px solid var(--line);background:var(--card-solid);color:var(--ink);max-width:100%}
.preview .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}

/* Trip overview */
.trip-hero{padding:22px 22px 24px;background:linear-gradient(135deg,var(--card-solid),var(--green-wash));border:1px solid var(--line);border-radius:22px}
.trip-hero .eyebrow{font-size:11px;letter-spacing:.18em;color:var(--muted)}
.trip-hero h1{font-family:var(--serif);font-weight:400;font-size:42px;line-height:1.1;margin:10px 0 12px;color:var(--green-deep)}
.trip-hero .meta{font-size:14px;letter-spacing:.04em}
.trip-hero .route{font-size:15px;color:var(--muted);margin-top:4px}
.trip-hero p{font-size:14px;margin:14px 0 0;max-width:30em}
.region{display:flex;align-items:baseline;gap:10px;margin:30px 0 10px}
.region .flag{font-size:20px}
.region h2{font-size:19px}
.region .en{font-family:var(--serif);font-size:13px;color:var(--muted)}
.region .n{margin-left:auto;font-size:13px;color:var(--muted)}
.days{list-style:none;margin:0;padding:0;border-radius:18px;overflow:hidden}
.days li+li{border-top:1px solid var(--line)}
.days a{display:grid;grid-template-columns:62px 26px 1fr 14px;gap:8px;padding:16px 16px 16px 20px;text-decoration:none;position:relative}
.days a::before{content:"";position:absolute;left:8px;top:0;bottom:0;width:1px;background:var(--line)}
.days a::after{content:"";position:absolute;left:5px;top:24px;width:7px;height:7px;border-radius:50%;background:var(--green)}
.days .d{font-weight:700;font-size:17px;line-height:1.2}
.days .w{font-size:12px;color:var(--muted)}
.days .ic{font-size:18px;line-height:1.3}
.days .ttl{font-weight:650;line-height:1.35;min-width:0}
.days .sum{font-weight:400;font-size:13px;color:var(--muted);margin-top:4px}
.days .chev{color:var(--muted);align-self:center}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.badge{font-size:12px;padding:2px 8px;border-radius:7px;background:var(--amber-soft);color:var(--amber);font-weight:600}
.badge.red{background:var(--red-soft);color:var(--red);border:1px solid color-mix(in srgb,var(--red) 40%,transparent)}
.badge.green{background:var(--green-soft);color:var(--green)}

/* Day */
.daynav{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;margin-bottom:22px}
.daynav a,.daynav span{border:1px solid var(--line);border-radius:14px;padding:10px 12px;text-decoration:none;background:var(--card);font-size:14px;color:var(--muted);min-height:44px;display:flex;align-items:center}
.daynav .mid{border-color:var(--green);color:var(--green);font-weight:650;justify-content:center}
.daynav .nx{justify-content:flex-end}
.daynav span{opacity:.45}
.day-eyebrow{font-size:13px;font-weight:700;letter-spacing:.08em;color:var(--green)}
.day-city{font-size:15px;font-weight:700;color:var(--green);margin-top:10px}
.day-title{font-size:26px;line-height:1.3;margin-top:6px}
.note{padding:18px 18px 16px;border-left:3px solid var(--green);background:var(--green-wash);border-radius:4px 16px 16px 4px}
.note h3{font-size:16px;margin-bottom:8px}
.note p{margin:0;font-size:14px}
.note ul{margin:0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:14px}
.note li.w{color:var(--amber)}
.note li.r{color:var(--red);font-weight:600}
details{border-top:1px solid var(--line);margin-top:14px;padding-top:12px}
details summary{cursor:pointer;font-weight:650;font-size:15px;list-style-position:outside}
details[open] summary{margin-bottom:8px}
.sched-head{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:10px;margin-top:10px}
.sched-head h2{font-size:18px}
.sched-head span{font-size:12px;color:var(--muted)}
.period{margin-top:20px}
.period h3{font-size:15px}
.period h3 b{color:var(--green)}
.tl{list-style:none;margin:12px 0 0;padding:0 0 0 52px;position:relative}
.tl::before{content:"";position:absolute;left:70px;top:6px;bottom:6px;width:1px;background:var(--line)}
.tl li{position:relative;padding:0 0 16px 32px}
.tl .ico{position:absolute;left:0;top:0;width:24px;text-align:center;font-size:17px;line-height:1.4;background:var(--paper)}
.tl .tm{font-size:13px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;position:absolute;left:-52px;top:2px;width:48px;text-align:right;line-height:1.2}
.tl .ti{font-weight:650;color:var(--green-deep);line-height:1.4}
.tl .ti.plain{color:var(--ink);font-weight:500}
.tl .sb{font-size:13.5px;margin-top:2px}
.tl .wn{font-size:13px;color:var(--amber);margin-top:2px}
.tl .mp{display:flex;gap:10px;margin-top:4px;font-size:12.5px}
.tl .mp a{color:var(--blue);text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--blue) 40%,transparent)}
.branch{padding:14px 16px;border-radius:14px;background:var(--amber-soft);font-size:14px;margin-top:6px}
.branch b{color:var(--amber)}
.branch p{margin:6px 0 0}
.more{display:flex;flex-direction:column;gap:12px;margin-top:26px}
.more details{border:1px solid var(--line);border-radius:16px;background:var(--card);padding:16px 16px;margin:0}
.more summary{display:flex;align-items:center;gap:14px;list-style:none}
.more summary::-webkit-details-marker{display:none}
.more summary .e{font-size:26px}
.more summary .tx{flex:1;min-width:0}
.more summary .tx b{display:block;font-size:16px}
.more summary .tx small{display:block;font-size:12.5px;color:var(--muted);font-weight:400}
.more summary .ch{color:var(--muted);transition:transform .2s}
.more details[open] .ch{transform:rotate(90deg)}
.more .body{font-size:14px;margin-top:12px;border-top:1px solid var(--line);padding-top:12px}
.more .body ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.kv{display:grid;grid-template-columns:5.5em 1fr;gap:4px 10px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0}

/* Actions / notes */
.sec-title{font-family:var(--serif);font-size:30px;font-weight:400;color:var(--green-deep);margin-bottom:6px}
.act{list-style:none;margin:0;padding:0}
.act li{padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:4px 12px}
.act li+li{border-top:1px solid var(--line)}
.act .a{font-weight:650;min-width:0}
.act .b{font-size:13px;color:var(--muted);grid-column:1/-1}
.act .due{font-size:12.5px;font-weight:700;white-space:nowrap;align-self:start}
.group-label{font-size:12px;letter-spacing:.14em;color:var(--muted);margin:24px 0 8px;font-weight:600}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;font-size:13.5px}
.tbl th,.tbl td{text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{font-size:12px;color:var(--muted);font-weight:600}
.plain-list{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.box{padding:16px 18px}

.foot{border-top:1px solid var(--line);margin-top:40px;padding-top:16px;font-size:12.5px;color:var(--muted)}
.foot p{margin:0 0 6px}

/* Bottom nav */
.global-nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.global-nav ul{list-style:none;margin:0 auto;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;max-width:560px}
.global-nav a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 6px;border-radius:12px;text-decoration:none;font-size:12px;color:var(--muted)}
.global-nav a[aria-current="page"]{background:var(--green-soft);color:var(--green-deep);font-weight:700}
.global-nav svg{width:22px;height:22px}
a:focus-visible,summary:focus-visible,select:focus-visible{outline:2px solid var(--green);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>

function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function md(d){const [,m,dd]=d.split("-");return `${+m}月${+dd}日`}
function mdShort(d){const [,m,dd]=d.split("-");return `${m}/${dd}`}
function dayId(d){return "d"+d.slice(5).replace("-","")}
function badgeHtml(b){return `<div class="badges">${b.map(([c,t])=>`<span class="badge ${c}">${esc(t)}</span>`).join("")}</div>`}

// 东京当地时间
let previewAt = null; // {date,time}
function tokyoNow(){
  if(previewAt) return previewAt;
  const p = new Intl.DateTimeFormat("en-CA",{timeZone:TZ,year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).formatToParts(new Date());
  const v={}; p.forEach(x=>v[x.type]=x.value);
  return {date:`${v.year}-${v.month}-${v.day}`,time:`${v.hour}:${v.minute}`};
}
function daysBetween(a,b){return Math.round((Date.parse(b)-Date.parse(a))/864e5)}

function renderToday(){
  const now = tokyoNow();
  const first = DAYS[0].date, last = DAYS[DAYS.length-1].date;
  let html = "";
  if(now.date < first){
    const n = daysBetween(now.date, first);
    const urgent = ACTIONS[0].items;
    html += `<section class="card hero">
      <div class="muted" style="font-size:13px">距出发</div>
      <div class="countdown tnum">${n}<span style="font-size:20px;font-family:var(--sans);margin-left:6px;color:var(--muted)">天</span></div>
      <div class="date" style="margin-top:10px">${md(first)} ${DAYS[0].wd} · 浦东 T1 12:20 → 中部 16:00</div>
      <div class="date">现在东京 ${md(now.date)} ${now.time}</div>
    </section>
    <section class="card next">
      <h2>出发前最急的事</h2>
      <p class="hint">完整清单在“待办”。</p>
      <ol>${urgent.map(x=>`<li><span class="t red">${esc(x.due)}</span><div><div>${esc(x.a)}</div><div class="s">${esc(x.b)}</div></div></li>`).join("")}</ol>
      <a class="link-arrow" href="#actions">查看全部待办 →</a>
    </section>
    <a class="link-arrow" href="#${dayId(first)}">查看第一天完整行程 →</a>`;
  } else if(now.date > last){
    html += `<section class="card hero"><div class="city" style="font-size:26px">行程已经结束</div><div class="date">${last} 返回 · 共 ${DAYS.length} 天</div><div class="muted" style="font-size:13px;margin-top:8px">目的地时间 Asia/Tokyo</div></section>`;
  } else {
    const d = DAYS.find(x=>x.date===now.date);
    const items = d.periods.flatMap(p=>p.items);
    const upcoming = items.filter(it=>it.t>=now.time).slice(0,4);
    const cur = [...items].reverse().find(it=>it.t<now.time);
    html += `<section class="card hero">
      <div class="city">${esc(d.city)}</div>
      <div class="date">${md(d.date)} · ${d.wd}</div>
      <div class="clock tnum">${now.time}<small>当地时间</small></div>
    </section>
    <section class="card next">
      <h2>下个定时节点</h2>
      <p class="hint">${cur?`刚才：${esc(cur.t)} ${esc(cur.ti)}`:"今天的安排还没开始。"}</p>
      ${upcoming.length?`<ol>${upcoming.map(it=>`<li><span class="t tnum">${esc(it.t)}</span><div><div>${esc(it.ti)}</div>${it.sb?`<div class="s">${esc(it.sb)}</div>`:""}${it.wn?`<div class="s amber">${esc(it.wn)}</div>`:""}</div></li>`).join("")}</ol>`:`<p>今天的定时安排都结束了。</p>`}
    </section>
    <a class="link-arrow" href="#${dayId(d.date)}">查看今天完整行程 →</a>`;
  }
  html += `<section class="card preview">
    <label for="pv">预览旅途中某一刻的“今天”页</label>
    <div class="row">
      <select id="pv">
        <option value="">现在（东京时间）</option>
        ${DAYS.map(d=>["08:00","13:00","17:30"].map(t=>`<option value="${d.date}|${t}" ${previewAt&&previewAt.date===d.date&&previewAt.time===t?"selected":""}>${mdShort(d.date)} ${d.wd} ${t}</option>`).join("")).join("")}
      </select>
    </div>
  </section>`;
  return `<div class="stack">${html}</div>`;
}

  const sched = `<div class="sched-head"><h2>当天行程</h2><span>按计划顺序</span></div>
    ${d.periods.map(p=>`<section class="period"><h3><b>${p.label}</b> · ${esc(p.title)}</h3>

        <span class="tm">${esc(it.t)}</span><span class="ico" aria-hidden="true">${it.i}</span>
        <div class="ti ${it.plain?"plain":""}">${esc(it.ti)}</div>
        ${it.sb?`<div class="sb">${esc(it.sb)}</div>`:""}
        ${it.wn?`<div class="wn">${esc(it.wn)}</div>`:""}
        ${it.map?`<div class="mp"><a href="${ap(it.map)}" target="_blank" rel="noopener">苹果地图</a><a href="${g(it.map)}" target="_blank" rel="noopener">谷歌地图</a></div>`:""}
      </li>`).join("")}</ul></section>`).join("")}`;
  const s = d.stay;
  const more = `<div class="more">
    <details><summary><span class="e">📷</span><span class="tx"><b>摄影详情</b><small>${d.photo.length} 个拍摄节点 · 构图、焦段与光线</small></span><span class="ch">›</span></summary>
      <div class="body"><ul>${d.photo.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div></details>
    <details><summary><span class="e">🏨</span><span class="tx"><b>住宿详情</b><small>今晚：${esc(s.name)}</small></span><span class="ch">›</span></summary>
      <div class="body"><dl class="kv">
        <dt>酒店</dt><dd>${esc(s.name)}</dd>
        ${s.addr?`<dt>位置</dt><dd>${esc(s.addr)}</dd>`:""}
        ${s.st?`<dt>状态</dt><dd><span class="badge">${esc(s.st)}</span></dd>`:""}
        <dt>要确认</dt><dd><ul style="padding-left:18px;margin:0">${s.need.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></dd>
      </dl></div></details>
    <details><summary><span class="e">📖</span><span class="tx"><b>这一天的完整说明</b><small>为什么这样排</small></span><span class="ch">›</span></summary>
      <div class="body"><p style="margin:0">${esc(d.why)}</p></div></details>
  </div>
  <p style="margin-top:22px"><a class="link-arrow" href="#trip">← 返回总行程</a></p>`;
  return `${nav}<div class="stack">${head}${plan}${remind}<div>${sched}</div></div>${more}`;
}

const app = document.getElementById("app");
function route(){
  const h = (location.hash||"#today").slice(1);
  let view = "today", html;
  const di = DAYS.findIndex(d=>dayId(d.date)===h);
  if(di>=0){view="trip";html=renderDay(di)}
  else if(h==="trip"){view="trip";html=renderTrip()}
  else if(h==="actions"){view="actions";html=renderActions()}
  else if(h==="notes"){view="notes";html=renderNotes()}
  else {html=renderToday()}
  app.innerHTML = html;
  document.querySelectorAll(".global-nav a").forEach(a=>{ if(a.dataset.nav===view) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
  const pv = document.getElementById("pv");
  if(pv) pv.addEventListener("change",()=>{const v=pv.value; previewAt = v?{date:v.split("|")[0],time:v.split("|")[1]}:null; route();});
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);
route();
setInterval(()=>{ if(!previewAt && (location.hash||"#today")==="#today") { const y=scrollY; route(); scrollTo(0,y);} },60000);
</script>
